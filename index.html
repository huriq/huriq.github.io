<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة حمودي الخاصة</title>
    
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- خط تجول -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        :root {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --primary: #d4af37;
            --text-color: #f1f1f1;
            --error: #ff4d4d;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--box-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #333;
            margin-top: 50px;
            height: fit-content;
        }

        h2 { color: var(--primary); font-weight: 700; }
        p { color: #bbb; }

        input[type="password"], input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #ebd075; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        #error-msg { color: var(--error); display: none; margin-top: 10px; }

        /* ستايل المنشورات */
        #feed-box, #admin-box { display: none; width: 100%; max-width: 700px; }
        
        .post {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .post p { color: #f1f1f1; font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; }
        .post img { width: 100%; border-radius: 8px; margin-top: 15px; }
        .post-date { font-size: 0.8rem; color: #777; margin-bottom: 10px; display: block; }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--primary);
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;
            margin: 20px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div class="container" id="login-box">
        <h2>🔒 صفحة حمودي</h2>
        <p>دخل الباسوورد حتى تشوف المنشورات</p>
        <input type="password" id="passcode" placeholder="الباسوورد..." onkeypress="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">دخول</button>
        <p id="error-msg">الباسوورد غلط يابة!</p>
    </div>

    <!-- شاشة عرض المنشورات للزوار -->
    <div id="feed-box">
        <h2 style="text-align: center; margin-bottom: 30px;">📜 كتابات وصور حمودي</h2>
        <div id="posts-container"></div>
        <div class="loader" id="feed-loader"></div>
    </div>

    <!-- شاشة الأدمن (للرفع) -->
    <div class="container" id="admin-box">
        <h2>🛠️ إضافة منشور جديد</h2>
        <p>اكتب النص واختار صورة (اختياري) وارفعها گبل لصفحتك</p>
        <textarea id="post-text" rows="5" placeholder="شنو ببالك هسة؟"></textarea>
        <input type="file" id="post-image" accept="image/*">
        <button id="upload-btn" onclick="uploadPost()">🚀 انشر هسة</button>
        <p id="admin-msg" style="margin-top: 15px;"></p>
    </div>

    <script>
        // ==========================================
        // معلومات الـ Supabase مالتك مدمجة هنا رسمياً
        // ==========================================
        const SUPABASE_URL = 'https://dafppielzdalbheyiucq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZnBwaWVsemRhbGJoZXlpdWNxIiqicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTkwNDQsImV4cCI6MjEwNTMzNTA0NH0.KkhbsF_bW1sS8eDtSautz9YV_fNoFiohXjcIIfq3WqQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // الباسوورد الرئيسي للصفحة (تگدر تغيره للرمز اللي يعجبك)
        const PAGE_PASSWORD = "123"; 

        // فحص الرابط إذا چان أدمن
        const isAdmin = new URLSearchParams(window.location.search).has('admin');

        function checkPassword() {
            const entered = document.getElementById('passcode').value;
            if(entered === PAGE_PASSWORD) {
                document.getElementById('login-box').style.display = 'none';
                if(isAdmin) {
                    document.getElementById('admin-box').style.display = 'block';
                } else {
                    document.getElementById('feed-box').style.display = 'block';
                    fetchPosts();
                }
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // جلب المنشورات من قاعدة البيانات
        async function fetchPosts() {
            document.getElementById('feed-loader').style.display = 'block';
            
            const { data, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            document.getElementById('feed-loader').style.display = 'none';
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (error) {
                container.innerHTML = '<p style="text-align:center; color:red;">صار خطأ بجلب البيانات!</p>';
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p style="text-align:center;">بعده حمودي مناشر شي!</p>';
                return;
            }

            data.forEach(post => {
                const date = new Date(post.created_at).toLocaleString('ar-IQ');
                let postHTML = `<div class="post">
                    <span class="post-date">🕒 ${date}</span>
                    <p>${post.content || ''}</p>`;
                
                if (post.image_url) {
                    postHTML += `<img src="${post.image_url}" alt="صورة المنشور">`;
                }
                
                postHTML += `</div>`;
                container.innerHTML += postHTML;
            });
        }

        // رفع منشور جديد (صورة + نص)
        async function uploadPost() {
            const textContent = document.getElementById('post-text').value;
            const imageFile = document.getElementById('post-image').files[0];
            const btn = document.getElementById('upload-btn');
            const msg = document.getElementById('admin-msg');

            if (!textContent && !imageFile) {
                msg.style.color = "var(--error)";
                msg.innerText = "اكتب شي أو اختار صورة على الأقل!";
                return;
            }

            btn.disabled = true;
            btn.innerText = "⏳ گاعد يرفع...";
            msg.innerText = "";

            let publicImageUrl = null;

            try {
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    
                    const { data: uploadData, error: uploadError } = await supabase.storage
                        .from('images')
                        .upload(fileName, imageFile);

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabase.storage
                        .from('images')
                        .getPublicUrl(fileName);
                    
                    publicImageUrl = publicUrlData.publicUrl;
                }

                const { error: insertError } = await supabase
                    .from('posts')
                    .insert([
                        { content: textContent, image_url: publicImageUrl }
                    ]);

                if (insertError) throw insertError;

                msg.style.color = "lightgreen";
                msg.innerText = "✅ عاشت ايدك! المنشور انرفع لصفحتك.";
                document.getElementById('post-text').value = '';
                document.getElementById('post-image').value = '';

            } catch (err) {
                console.error(err);
                msg.style.color = "var(--error)";
                msg.innerText = "❌ صار خطأ بالرفع، تأكد من الإعدادات!";
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 انشر هسة";
            }
        }
    </script>
</body>
</html>
