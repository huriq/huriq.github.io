<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة حمودي الحبيبة</title>
    
    <!-- خط تجول الأنيق -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        
        :root {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --primary: #d4af37;
            --text-color: #f1f1f1;
            --error: #ff4d4d;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--box-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #333;
            margin-top: 30px;
            height: fit-content;
        }

        h2 { color: var(--primary); font-weight: 700; }
        p { color: #bbb; }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, textarea:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #ebd075; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        #error-msg { color: var(--error); display: none; margin-top: 10px; }

        /* ستايل المنشورات */
        #feed-box, #admin-box { display: none; width: 100%; max-width: 700px; margin: auto; }
        
        .post {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .post p { color: #f1f1f1; font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; }
        .post img { width: 100%; border-radius: 8px; margin-top: 15px; }
        .post-date { font-size: 0.8rem; color: #777; margin-bottom: 10px; display: block; }

        .loader {
            border: 4px solid #333; border-top: 4px solid var(--primary);
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;
            margin: 20px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div class="container" id="login-box">
        <h2>🔒 صفحة حمودي</h2>
        <p>دخل الباسوورد حتى تشوف المنشورات</p>
        <input type="password" id="passcode" placeholder="الباسوورد..." onkeypress="if(event.key === 'Enter') checkPassword()">
        <button onclick="checkPassword()">دخول</button>
        <p id="error-msg">الباسوورد غلط يابة!</p>
    </div>

    <!-- شاشة عرض المنشورات للزوار -->
    <div id="feed-box">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--primary);">📜 كتابات وصور حمودي</h2>
        <div id="posts-container"></div>
        <div class="loader" id="feed-loader"></div>
    </div>

    <!-- شاشة الأدمن (للوحة التحكم) -->
    <div class="container" id="admin-box">
        <h2>🛠️ لوحة التحكم والنشر</h2>
        <p>اكتب النص أو حط رابط الصورة، وخلي الـ Token مالتك حتى ننشر فوري</p>
        
        <input type="password" id="gh-token" placeholder="حط الـ GitHub Token هنا (مرة وحدة)...">
        <textarea id="post-text" rows="5" placeholder="شنو ببالك تحجي هسة؟"></textarea>
        <input type="text" id="post-image" placeholder="رابط الصورة (اختياري - مثلاً رابط مباشر من الإنترنت)...">
        
        <button id="upload-btn" onclick="publishPost()">🚀 انشر بصفحتي هسة</button>
        <p id="admin-msg" style="margin-top: 15px;"></p>
    </div>

    <script>
        // ==========================================
        // إعدادات گيتهوب الخاصة بيك (مضبوطة لـ huriq.github.io)
        // ==========================================
        const GITHUB_USERNAME = 'huriq'; 
        const REPO_NAME = 'huriq.github.io';
        const PAGE_PASSWORD = "123"; // تقدر تبدله بالباسوورد اللي يعجبك

        const isAdmin = new URLSearchParams(window.location.search).has('admin');

        function checkPassword() {
            const entered = document.getElementById('passcode').value;
            if(entered === PAGE_PASSWORD) {
                document.getElementById('login-box').style.display = 'none';
                if(isAdmin) {
                    document.getElementById('admin-box').style.display = 'block';
                    // استرجاع الـ token المخزون محلياً بالمتصفح إذا موجود
                    const savedToken = localStorage.getItem('my_gh_token');
                    if(savedToken) {
                        document.getElementById('gh-token').value = savedToken;
                    }
                } else {
                    document.getElementById('feed-box').style.display = 'block';
                    fetchPosts();
                }
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // جلب المنشورات من ملف posts.json
        async function fetchPosts() {
            document.getElementById('feed-loader').style.display = 'block';
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/posts.json?t=${Date.now()}`);
                if (!response.ok) throw new Error();
                const posts = await response.json();
                
                document.getElementById('feed-loader').style.display = 'none';
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">بعده حمودي مناشر شي!</p>';
                    return;
                }

                // عرض الأحدث بالبداية
                posts.reverse().forEach(post => {
                    let postHTML = `<div class="post">
                        <span class="post-date">🕒 ${post.date}</span>
                        <p>${post.content || ''}</p>`;
                    
                    if (post.image) {
                        postHTML += `<img src="${post.image}" alt="صورة المنشور">`;
                    }
                    
                    postHTML += `</div>`;
                    container.innerHTML += postHTML;
                });
            } catch (err) {
                document.getElementById('feed-loader').style.display = 'none';
                document.getElementById('posts-container').innerHTML = '<p style="text-align:center; color:red;">ما قدرنا نجلب المنشورات، تأكد من وجود ملف posts.json!</p>';
            }
        }

        // نشر بوست جديد وتحديث ملف posts.json على گيتهوب تلقائياً
        async function publishPost() {
            const token = document.getElementById('gh-token').value.trim();
            const textContent = document.getElementById('post-text').value.trim();
            const imageUrl = document.getElementById('post-image').value.trim();
            const btn = document.getElementById('upload-btn');
            const msg = document.getElementById('admin-msg');

            if (!token) {
                msg.style.color = "var(--error)";
                msg.innerText = "لازم تحط الـ GitHub Token بالمستطيل فوق!";
                return;
            }

            if (!textContent && !imageUrl) {
                msg.style.color = "var(--error)";
                msg.innerText = "اكتب نص أو حط رابط صورة على الأقل!";
                return;
            }

            // خزنه بالمتصفح حتى ما تضطر تكتبه كل مرة
            localStorage.setItem('my_gh_token', token);

            btn.disabled = true;
            btn.innerText = "⏳ قاعد نحدث گيتهوب...";
            msg.innerText = "";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/posts.json`;

            try {
                // 1. جلب الملف الحالي وشاهد الـ SHA مالته (مطلوب من گيتهوب حتى يسمح بالتعديل)
                const getRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (!getRes.ok) throw new Error("فشل الاتصال بـ GitHub، تأكد من الـ Token!");
                
                const fileData = await getRes.json();
                const currentSha = fileData.sha;
                
                // فك تشفير المحتوى القديم
                let existingPosts = [];
                if (fileData.content) {
                    const decodedBytes = Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0));
                    const decodedString = new TextDecoder().decode(decodedBytes);
                    existingPosts = JSON.parse(decodedString);
                }

                // 2. إضافة البوست الجديد للمصفوفة
                const newPost = {
                    content: textContent,
                    image: imageUrl,
                    date: new Date().toLocaleString('ar-IQ')
                };
                existingPosts.push(newPost);

                // 3. تحويل المصفوفة الجديدة إلى نص وتشفيرها Base64
                const updatedString = JSON.stringify(existingPosts, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(updatedString)));

                // 4. إرسال التحديث لـ گيتهوب (Commit تلقائي)
                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Add new post via web admin`,
                        content: encodedContent,
                        sha: currentSha
                    })
                });

                if (!putRes.ok) throw new Error("فشل حفظ التحديث على المستودع!");

                msg.style.color = "lightgreen";
                msg.innerText = "✅ عاشت ايدك! انشرت بنجاح وتحدث گيتهوب تلقائياً.";
                document.getElementById('post-text').value = '';
                document.getElementById('post-image').value = '';

            } catch (err) {
                console.error(err);
                msg.style.color = "var(--error)";
                msg.innerText = "❌ صار خطأ: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 انشر بصفحتي هسة";
            }
        }
    </script>
</body>
</html>
