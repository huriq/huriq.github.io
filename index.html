<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUR | Official Platform</title>
    
    <!-- الخطوط العالمية والعربية الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Tajawal:wght@500;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #070b19;
            --surface: #0f172a;
            --surface-glass: rgba(15, 23, 42, 0.75);
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #005bea;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(0, 210, 255, 0.2);
            --error: #f43f5e;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.08) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
        }

        /* الهيدر الأسطوري مع الوقت والتاريخ */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-glass);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
            color: var(--primary);
            backdrop-filter: blur(10px);
        }

        .brand-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.6));
        }

        .brand-subtitle {
            font-family: 'Tajawal', sans-serif;
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* شاشة الدخول واللوحة */
        .auth-card, .admin-card {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Tajawal', sans-serif;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            background-color: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #070b19;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

        .error-text { color: var(--error); margin-top: 10px; font-size: 0.9rem; display: none; }

        /* شريط الأدوات المصغر (محرر النصوص الوورد) */
        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            width: auto;
            cursor: pointer;
            box-shadow: none;
            font-family: 'Tajawal', sans-serif;
        }
        .tool-btn:hover { background: var(--primary); color: #070b19; box-shadow: none; transform: none; }

        /* التبويبات الفخمة */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 30px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: auto;
            box-shadow: none;
            font-size: 0.95rem;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #070b19;
            border-color: transparent;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        /* شريط الفولدرات الثانوية */
        .subfolders-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .folder-chip {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: 'Tajawal', sans-serif;
        }

        .folder-chip.active, .folder-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 210, 255, 0.05);
        }

        /* زر الرجوع 3D */
        .back-home-bar {
            margin-bottom: 25px;
            display: none;
        }

        .btn-3d-back {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 10px 22px;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: auto;
            box-shadow: 0 5px 0 #020617, 0 8px 15px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }
        .btn-3d-back:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #020617, 0 10px 20px rgba(0, 210, 255, 0.3); }
        .btn-3d-back:active { transform: translateY(3px); box-shadow: 0 2px 0 #020617, 0 4px 8px rgba(0,0,0,0.5); }

        /* حاوية المنشورات وضبط النص الوورد Justify */
        #content-area { display: none; }

        .post-card {
            background: var(--surface-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            padding-bottom: 10px;
        }

        .post-tag {
            font-size: 0.8rem;
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .post-date { font-size: 0.8rem; color: var(--text-muted); }

        .post-body {
            font-size: 1.1rem;
            line-height: 1.9;
            color: var(--text-main);
            text-align: justify; /* ضبط النص مثل الوورد بالضبط */
            word-break: break-word;
            margin-bottom: 15px;
        }

        .post-image {
            width: 100%;
            border-radius: 12px;
            max-height: 450px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
        }

        /* نظام الردود والتفاعلات */
        .replies-section {
            margin-top: 20px;
            border-top: 1px dashed rgba(148, 163, 184, 0.2);
            padding-top: 15px;
        }

        .reply-item {
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 10px;
            padding: 12px 15px;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .reply-author {
            color: var(--primary);
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .reply-text {
            color: var(--text-main);
            text-align: justify;
            line-height: 1.6;
        }

        .btn-reply-toggle {
            background: transparent;
            color: var(--primary);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 8px;
            width: auto;
            margin-top: 10px;
            box-shadow: none;
        }
        .btn-reply-toggle:hover { background: rgba(0, 210, 255, 0.1); box-shadow: none; transform: none; }

        .reply-form-box {
            margin-top: 12px;
            background: rgba(15, 23, 42, 0.9);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: none;
        }

        /* لوحة التحكم والإدارة */
        .manage-section {
            margin-top: 35px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 25px;
            text-align: right;
        }

        .manage-item {
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .manage-info { flex-grow: 1; overflow: hidden; }
        .manage-text { font-size: 0.95rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .manage-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .btn-edit { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); padding: 6px 14px; font-size: 0.85rem; border-radius: 8px; width: auto; box-shadow: none; }
        .btn-edit:hover { background: var(--warning); color: #000; box-shadow: none; }

        .btn-delete { background: rgba(244, 63, 94, 0.15); color: var(--error); border: 1px solid rgba(244, 63, 94, 0.4); padding: 6px 14px; font-size: 0.85rem; border-radius: 8px; width: auto; box-shadow: none; }
        .btn-delete:hover { background: var(--error); color: #fff; box-shadow: none; }

        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .empty-msg { text-align: center; color: var(--text-muted); font-size: 1.1rem; margin-top: 40px; }

        footer { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid rgba(148, 163, 184, 0.1); color: var(--text-muted); font-family: 'Montserrat', 'Tajawal', sans-serif; font-size: 0.95rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الهيدر الأسطوري -->
        <header>
            <div class="header-top-bar">
                <span id="live-date">📅 جاري تحميل التاريخ...</span>
                <span id="live-clock" style="font-weight: 700; letter-spacing: 1px;">⏰ 00:00:00 AM</span>
            </div>
            <div class="brand-logo" onclick="resetToHome()">HUR</div>
            <div class="brand-subtitle">DIGITAL PLATFORM & ARCHIVE</div>
        </header>

        <!-- شاشة الحماية -->
        <div class="auth-card" id="login-screen">
            <h2>🔒 Restricted Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">الرجاء إدخال رمز المرور للمتابعة</p>
            <input type="password" id="passcode-input" placeholder="رمز المرور..." onkeypress="if(event.key === 'Enter') verifyPass()">
            <button onclick="verifyPass()">دخول</button>
            <p class="error-text" id="login-error">رمز المرور غير صحيح!</p>
        </div>

        <!-- لوحة التحكم الإدارية الذكية -->
        <div class="admin-card" id="admin-panel" style="display: none;">
            <h2>🛠️ لوحة التحكم والإدارة الذكية</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">انشر محتوى وحدد التبويب والفولدر المناسب بدقة</p>
            
            <input type="password" id="gh-token" placeholder="GitHub Personal Access Token...">
            <input type="hidden" id="edit-index" value="-1">

            <select id="post-type" onchange="toggleFolderInput()">
                <option value="home">🏠 الصفحة الرئيسية</option>
                <option value="beliefs">🌟 المعتقدات</option>
                <option value="writings">📄 المكتوبات</option>
                <option value="correspondence">📜 المكاتبات</option>
                <option value="visuals">🖼️ المرئيات</option>
                <option value="audio">🎧 المسموعات</option>
                <option value="archives">📁 المحفوظات</option>
            </select>

            <input type="text" id="post-folder" placeholder="اسم الفولدر أو التصنيف الفرعي (اختياري، مثلاً: جيمايا)...">

            <!-- محرر النصوص (Word Toolbar) -->
            <div class="editor-toolbar">
                <button type="button" class="tool-btn" onclick="formatText('bold')"><b>عريض Bold</b></button>
                <button type="button" class="tool-btn" onclick="formatText('justify')"><b>ضبط Justify</b></button>
                <button type="button" class="tool-btn" onclick="formatText('p')"><b>فقرة جديدة</b></button>
            </div>

            <textarea id="post-content" rows="5" placeholder="اكتب محتوى المنشور هنا..."></textarea>
            <input type="text" id="post-image-url" placeholder="رابط الصورة المباشر (اختياري)...">
            
            <button id="publish-btn" onclick="saveOrUpdatePost()">🚀 نشر المحتوى فوراً</button>
            <button id="cancel-edit-btn" onclick="cancelEdit()" style="display:none; background:#334155; color:#fff; margin-top:10px;">إلغاء التعديل</button>
            
            <p id="admin-feedback" style="margin-top: 15px; font-weight: 700;"></p>

            <div class="manage-section">
                <h3 style="font-family: 'Tajawal', sans-serif; color: var(--primary); margin-bottom: 15px; font-size: 1.2rem;">📁 إدارة المنشورات الحالية</h3>
                <div class="loader" id="admin-loader"></div>
                <div id="manage-posts-list"></div>
            </div>
        </div>

        <!-- قسم العرض والتبويبات السبعة -->
        <div id="content-area">
            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('home', this)">🏠 الصفحة الرئيسية</button>
                <button class="tab-btn" onclick="switchTab('beliefs', this)">🌟 المعتقدات</button>
                <button class="tab-btn" onclick="switchTab('writings', this)">📄 المكتوبات</button>
                <button class="tab-btn" onclick="switchTab('correspondence', this)">📜 المكاتبات</button>
                <button class="tab-btn" onclick="switchTab('visuals', this)">🖼️ المرئيات</button>
                <button class="tab-btn" onclick="switchTab('audio', this)">🎧 المسموعات</button>
                <button class="tab-btn" onclick="switchTab('archives', this)">📁 المحفوظات</button>
            </div>

            <!-- زر الرجوع 3D -->
            <div class="back-home-bar" id="back-bar">
                <button class="btn-3d-back" onclick="resetToHome()">
                    <span>↩ العودة للرئيسية</span>
                </button>
            </div>

            <!-- الفولدرات الثانوية -->
            <div id="subfolders-container" class="subfolders-bar" style="display: none;"></div>

            <div class="loader" id="main-loader"></div>
            <div id="posts-feed"></div>
        </div>

        <footer>
            © Designed by HUR
        </footer>
    </div>

    <script>
        const GITHUB_USERNAME = 'huriq'; 
        const REPO_NAME = 'huriq.github.io';
        const PAGE_PASSWORD = "123";

        let allPostsData = [];
        let currentFilter = 'home';
        let currentFolderFilter = 'all';
        const isAdminMode = new URLSearchParams(window.location.search).has('admin');

        // الساعة والتاريخ
        function updateClockAndDate() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('live-clock').innerText = `⏰ ${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            document.getElementById('live-date').innerText = `📅 ${now.toLocaleDateString('ar-IQ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();

        function verifyPass() {
            const val = document.getElementById('passcode-input').value;
            if(val === PAGE_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                if(isAdminMode) {
                    document.getElementById('admin-panel').style.display = 'block';
                    const savedT = localStorage.getItem('hur_gh_token');
                    if(savedT) document.getElementById('gh-token').value = savedT;
                    fetchPostsForAdmin();
                } else {
                    document.getElementById('content-area').style.display = 'block';
                    loadPosts();
                }
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadPosts() {
            const loader = document.getElementById('main-loader');
            loader.style.display = 'block';
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/posts.json?t=${Date.now()}`);
                if(!res.ok) throw new Error();
                allPostsData = await res.json();
                loader.style.display = 'none';
                renderPosts();
            } catch(e) {
                loader.style.display = 'none';
                allPostsData = [];
                renderPosts();
            }
        }

        function switchTab(filter, btnElement) {
            currentFilter = filter;
            currentFolderFilter = 'all';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) {
                btnElement.classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    if(b.getAttribute('onclick')?.includes(filter)) b.classList.add('active');
                });
            }

            const backBar = document.getElementById('back-bar');
            backBar.style.display = (filter !== 'home') ? 'block' : 'none';

            buildSubfolders();
            renderPosts();
        }

        function resetToHome() {
            switchTab('home', document.querySelector('.tab-btn'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getTabName(type) {
            switch(type) {
                case 'home': return 'الصفحة الرئيسية';
                case 'beliefs': return 'المعتقدات';
                case 'writings': return 'المكتوبات';
                case 'correspondence': return 'المكاتبات';
                case 'visuals': return 'المرئيات';
                case 'audio': return 'المسموعات';
                case 'archives': return 'المحفوظات';
                default: return 'الصفحة الرئيسية';
            }
        }

        function buildSubfolders() {
            const bar = document.getElementById('subfolders-container');
            bar.innerHTML = '';
            
            // استخراج الفولدرات الخاصة بهذا التبويب فقط
            const folders = [...new Set(allPostsData.filter(p => (p.type || 'home') === currentFilter && p.folder).map(p => p.folder))];
            
            // إضافة خيار إضافي لتبويب المكاتبات وهو "مكتوبات الآخرين"
            if(currentFilter === 'correspondence') {
                if(!folders.includes('مكتوبات الآخرين')) folders.push('مكتوبات الآخرين');
            }

            if(folders.length === 0) {
                bar.style.display = 'none';
                return;
            }

            bar.style.display = 'flex';
            bar.innerHTML += `<div class="folder-chip active" onclick="filterFolder('all', this)">الكل</div>`;
            folders.forEach(f => {
                bar.innerHTML += `<div class="folder-chip" onclick="filterFolder('${f}', this)">📂 ${f}</div>`;
            });
        }

        function filterFolder(folderName, element) {
            currentFolderFilter = folderName;
            document.querySelectorAll('.folder-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderPosts();
        }

        function renderPosts() {
            const feed = document.getElementById('posts-feed');
            feed.innerHTML = '';

            let filtered = allPostsData.filter(p => {
                const t = p.type || 'home';
                if(t !== currentFilter) return false;
                if(currentFolderFilter !== 'all') {
                    if(p.folder !== currentFolderFilter) return false;
                }
                return true;
            });

            if(filtered.length === 0) {
                feed.innerHTML = `<p class="empty-msg">لا توجد منشورات في قسم "${getTabName(currentFilter)}" حالياً.</p>`;
                return;
            }

            filtered.slice().reverse().forEach((post, actualRevIndex) => {
                const realIndex = allPostsData.indexOf(post);
                const typeLabel = getTabName(post.type || 'home');
                const folderTag = post.folder ? ` / 📂 ${post.folder}` : '';
                
                let html = `
                    <div class="post-card">
                        <div class="post-header">
                            <span class="post-tag">${typeLabel}${folderTag}</span>
                            <span class="post-date">🕒 ${post.date}</span>
                        </div>`;
                
                if(post.content) {
                    html += `<div class="post-body">${post.content}</div>`;
                }

                if(post.image) {
                    html += `<img src="${post.image}" class="post-image" alt="Post Image">`;
                }

                // نظام الردود والتعليقات
                html += `<div class="replies-section">
                            <div style="font-family:'Tajawal'; font-weight:700; color:var(--primary); font-size:0.9rem; margin-bottom:10px;">💬 الردود والمناقشات</div>`;
                
                if(post.replies && post.replies.length > 0) {
                    post.replies.forEach(rep => {
                        html += `
                            <div class="reply-item">
                                <div class="reply-author">👤 ${rep.author} <span style="font-size:0.75rem; color:var(--text-muted); font-weight:400;">(${rep.date})</span></div>
                                <div class="reply-text">${rep.text}</div>
                            </div>`;
                    });
                } else {
                    html += `<div style="font-size:0.85rem; color:var(--text-muted);">لا توجد ردود بعد. كن أول المردودين!</div>`;
                }

                html += `
                    <button class="btn-reply-toggle" onclick="toggleReplyForm(${realIndex})">✍️ كتابة رد</button>
                    <div class="reply-form-box" id="reply-form-${realIndex}">
                        <input type="text" id="reply-author-${realIndex}" placeholder="اسمك الكريم..." style="margin-bottom:10px; padding:10px; font-size:0.9rem;">
                        <textarea id="reply-text-${realIndex}" rows="3" placeholder="اكتب ردك هنا..." style="margin-bottom:10px; padding:10px; font-size:0.9rem;"></textarea>
                        <button onclick="submitReply(${realIndex})" style="padding:10px; font-size:0.95rem;">إرسال الرد</button>
                    </div>
                </div>`;

                html += `</div>`;
                feed.innerHTML += html;
            });
        }

        function toggleReplyForm(index) {
            const box = document.getElementById(`reply-form-${index}`);
            box.style.display = (box.style.display === 'block') ? 'none' : 'block';
        }

        // دالة إرسال الرد وتحديث البيانات على گيتهوب مباشرة
        async function submitReply(index) {
            const author = document.getElementById(`reply-author-${index}`).value.trim();
            const text = document.getElementById(`reply-text-${index}`).value.trim();

            if(!author || !text) {
                alert("الرجاء إدخال الاسم ومحتوى الرد!");
                return;
            }

            const token = prompt("أدخل رمز المرور أو صلاحية النشر (GitHub Token) لتأكيد إضافة الرد:");
            if(!token) return;

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/posts.json`;

            try {
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                if(!getRes.ok) throw new Error("فشل الاتصال بـ GitHub.");
                
                const fileData = await getRes.json();
                const sha = fileData.sha;
                let existing = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0))));

                if(!existing[index].replies) existing[index].replies = [];
                existing[index].replies.push({
                    author: author,
                    text: text,
                    date: new Date().toLocaleString('ar-IQ')
                });

                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2))));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Add reply to post index ${index}`,
                        content: encoded,
                        sha: sha
                    })
                });

                if(!putRes.ok) throw new Error("فشل حفظ الرد.");

                alert("✅ تم إرسال ردك بنجاح!");
                loadPosts();

            } catch(err) {
                alert("❌ خطأ: " + err.message);
            }
        }

        // محرر النصوص الوورد المصغر
        function formatText(type) {
            const textarea = document.getElementById('post-content');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const val = textarea.value;

            if(type === 'bold') {
                textarea.value = val.substring(0, start) + `<strong>` + val.substring(start, end) + `</strong>` + val.substring(end);
            } else if(type === 'justify') {
                textarea.value = val.substring(0, start) + `<div style="text-align:justify;">` + val.substring(start, end) + `</div>` + val.substring(end);
            } else if(type === 'p') {
                textarea.value = val.substring(0, start) + `\n<p>\n` + val.substring(start, end) + `\n</p>\n` + val.substring(end);
            }
        }

        async function fetchPostsForAdmin() {
            const loader = document.getElementById('admin-loader');
            const listContainer = document.getElementById('manage-posts-list');
            loader.style.display = 'block';

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/posts.json?t=${Date.now()}`);
                if(!res.ok) throw new Error();
                allPostsData = await res.json();
                loader.style.display = 'none';
                renderAdminList();
            } catch(e) {
                loader.style.display = 'none';
                allPostsData = [];
                listContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">قائمة المنشورات فارغة.</p>';
            }
        }

        function renderAdminList() {
            const listContainer = document.getElementById('manage-posts-list');
            listContainer.innerHTML = '';

            if(!allPostsData || allPostsData.length === 0) {
                listContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">قائمة المنشورات فارغة.</p>';
                return;
            }

            allPostsData.map((post, index) => ({ ...post, realIndex: index })).slice().reverse().forEach(item => {
                const snippet = item.content ? item.content.replace(/<[^>]*>/g, '') : '[صورة]';
                const tLabel = getTabName(item.type || 'home');
                const fLabel = item.folder ? ` [فولدر: ${item.folder}]` : '';
                listContainer.innerHTML += `
                    <div class="manage-item">
                        <div class="manage-info">
                            <div class="manage-text"><strong>[${tLabel}${fLabel}]</strong>: ${snippet}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted);">${item.date}</div>
                        </div>
                        <div class="manage-actions">
                            <button class="btn-edit" onclick="prepareEdit(${item.realIndex})">تعديل</button>
                            <button class="btn-delete" onclick="deletePost(${item.realIndex})">حذف</button>
                        </div>
                    </div>`;
            });
        }

        function prepareEdit(index) {
            const post = allPostsData[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('post-type').value = post.type || 'home';
            document.getElementById('post-folder').value = post.folder || '';
            document.getElementById('post-content').value = post.content || '';
            document.getElementById('post-image-url').value = post.image || '';
            
            const pubBtn = document.getElementById('publish-btn');
            pubBtn.innerText = "💾 حفظ التعديلات";
            document.getElementById('cancel-edit-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('edit-index').value = "-1";
            document.getElementById('post-folder').value = '';
            document.getElementById('post-content').value = '';
            document.getElementById('post-image-url').value = '';
            document.getElementById('publish-btn').innerText = "🚀 نشر المحتوى فوراً";
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        async function saveOrUpdatePost() {
            const token = document.getElementById('gh-token').value.trim();
            const editIndex = parseInt(document.getElementById('edit-index').value);
            const type = document.getElementById('post-type').value;
            const folder = document.getElementById('post-folder').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const image = document.getElementById('post-image-url').value.trim();
            const btn = document.getElementById('publish-btn');
            const feedback = document.getElementById('admin-feedback');

            if(!token) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "الرجاء إدخال الـ GitHub Token!";
                return;
            }

            if(!content && !image) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "أدخل نصاً أو رابط صورة على الأقل!";
                return;
            }

            localStorage.setItem('hur_gh_token', token);
            btn.disabled = true;
            btn.innerText = "جاري التحديث في المستودع...";
            feedback.innerText = "";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/posts.json`;

            try {
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                let sha = null;
                let existing = [];

                if(getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                    if(fileData.content) {
                        existing = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0))));
                    }
                }

                let commitMsg = "";
                if(editIndex >= 0) {
                    existing[editIndex] = {
                        type: type,
                        folder: folder,
                        content: content,
                        image: image,
                        date: existing[editIndex].date,
                        replies: existing[editIndex].replies || []
                    };
                    commitMsg = `Update post index ${editIndex}`;
                } else {
                    existing.push({
                        type: type,
                        folder: folder,
                        content: content,
                        image: image,
                        date: new Date().toLocaleString('ar-IQ'),
                        replies: []
                    });
                    commitMsg = `Add new ${type} post`;
                }

                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2))));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: commitMsg, content: encoded, sha: sha })
                });

                if(!putRes.ok) throw new Error("فشل حفظ التحديث في المستودع.");

                feedback.style.color = "var(--success)";
                feedback.innerText = editIndex >= 0 ? "✅ تم تحديث المنشور بنجاح!" : "✅ تم نشر المحتوى بنجاح!";
                
                cancelEdit();
                fetchPostsForAdmin();

            } catch(err) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "❌ خطأ: " + err.message;
            } finally {
                btn.disabled = false;
                if(document.getElementById('edit-index').value == "-1") {
                    btn.innerText = "🚀 نشر المحتوى فوراً";
                }
            }
        }

        async function deletePost(index) {
            if(!confirm("هل أنت متأكد من حذف هذا المنشور نهائياً؟")) return;

            const token = document.getElementById('gh-token').value.trim();
            const feedback = document.getElementById('admin-feedback');

            if(!token) {
                alert("الرجاء إدخال الـ GitHub Token أولاً!");
                return;
            }

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/posts.json`;

            try {
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                if(!getRes.ok) throw new Error("فشل الاتصال بـ GitHub.");
                
                const fileData = await getRes.json();
                let existing = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0))));

                existing.splice(index, 1);

                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2))));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: `Delete post index ${index}`, content: encoded, sha: fileData.sha })
                });

                if(!putRes.ok) throw new Error("فشل الحذف من المستودع.");

                feedback.style.color = "var(--success)";
                feedback.innerText = "🗑️ تم حذف المنشور بنجاح!";
                fetchPostsForAdmin();

            } catch(err) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "❌ خطأ بالحذف: " + err.message;
            }
        }
    </script>
</body>
</html>
