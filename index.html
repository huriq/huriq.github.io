<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUR | Official Platform</title>
    
    <!-- الخطوط العالمية والعربية الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Tajawal:wght@500;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #070b19;
            --surface: #0f172a;
            --surface-glass: rgba(15, 23, 42, 0.75);
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #005bea;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(0, 210, 255, 0.2);
            --error: #f43f5e;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.08) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 800px;
        }

        /* الهيدر والعنوان الفخم */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-family: 'Tajawal', sans-serif;
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* شاشة الدخول */
        .auth-card, .admin-card {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Tajawal', sans-serif;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            background-color: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #070b19;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }

        .error-text { color: var(--error); margin-top: 10px; font-size: 0.9rem; display: none; }

        /* التبويبات الفخمة */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 30px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: auto;
            box-shadow: none;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #070b19;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* حاوية المنشورات */
        #content-area { display: none; }

        .post-card {
            background: var(--surface-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            padding-bottom: 10px;
        }

        .post-tag {
            font-size: 0.8rem;
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .post-date { font-size: 0.8rem; color: var(--text-muted); }

        .post-body {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .post-image {
            width: 100%;
            border-radius: 12px;
            max-height: 500px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 40px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .empty-msg { text-align: center; color: var(--text-muted); font-size: 1.1rem; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الهيدر -->
        <header>
            <div class="brand-logo">HUR</div>
            <div class="brand-subtitle">DIGITAL PLATFORM & ARCHIVE</div>
        </header>

        <!-- شاشة الحماية (الباسوورد) -->
        <div class="auth-card" id="login-screen">
            <h2>🔒 Restricted Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">الرجاء إدخال رمز المرور للمتابعة</p>
            <input type="password" id="passcode-input" placeholder="رمز المرور..." onkeypress="if(event.key === 'Enter') verifyPass()">
            <button onclick="verifyPass()">دخول</button>
            <p class="error-text" id="login-error">رمز المرور غير صحيح!</p>
        </div>

        <!-- لوحة التحكم (تظهر فقط عند إضافة ?admin=1 بالرابط) -->
        <div class="admin-card" id="admin-panel" style="display: none;">
            <h2>🛠️ لوحة التحكم والإدارة</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">انشر محتوى جديد ووجهه للقسم المناسب</p>
            
            <input type="password" id="gh-token" placeholder="GitHub Personal Access Token...">
            
            <select id="post-type">
                <option value="text">📄 منشور نصي (كتابات ونصوص)</option>
                <option value="image">🖼️ منشور صور (معرض الصور)</option>
            </select>

            <textarea id="post-content" rows="4" placeholder="اكتب محتوى المنشور هنا..."></textarea>
            <input type="text" id="post-image-url" placeholder="رابط الصورة المباشر (اختياري للنصوص، إلزامي للصور)...">
            
            <button id="publish-btn" onclick="createNewPost()">🚀 نشر المحتوى فوراً</button>
            <p id="admin-feedback" style="margin-top: 15px; font-weight: 700;"></p>
        </div>

        <!-- قسم العرض والتبويبات -->
        <div id="content-area">
            <div class="tabs-container">
                <button class="tab-btn active" onclick="switchTab('all', this)">الكل</button>
                <button class="tab-btn" onclick="switchTab('text', this)">📄 النصوص والكتابات</button>
                <button class="tab-btn" onclick="switchTab('image', this)">🖼️ معرض الصور</button>
            </div>

            <div class="loader" id="main-loader"></div>
            <div id="posts-feed"></div>
        </div>
    </div>

    <script>
        const GITHUB_USERNAME = 'huriq'; 
        const REPO_NAME = 'huriq.github.io';
        const PAGE_PASSWORD = "123"; // تقدر تبدله بالرمز اللي يعجبك

        let allPostsData = [];
        let currentFilter = 'all';
        const isAdminMode = new URLSearchParams(window.location.search).has('admin');

        function verifyPass() {
            const val = document.getElementById('passcode-input').value;
            if(val === PAGE_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                if(isAdminMode) {
                    document.getElementById('admin-panel').style.display = 'block';
                    const savedT = localStorage.getItem('hur_gh_token');
                    if(savedT) document.getElementById('gh-token').value = savedT;
                } else {
                    document.getElementById('content-area').style.display = 'block';
                    loadPosts();
                }
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadPosts() {
            const loader = document.getElementById('main-loader');
            const feed = document.getElementById('posts-feed');
            loader.style.display = 'block';
            
            try {
                const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/posts.json?t=${Date.now()}`);
                if(!res.ok) throw new Error();
                allPostsData = await res.json();
                loader.style.display = 'none';
                renderPosts();
            } catch(e) {
                loader.style.display = 'none';
                feed.innerHTML = '<p class="empty-msg">لم يتم العثور على بيانات أو أن الملف فارغ.</p>';
            }
        }

        function switchTab(filter, btnElement) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            renderPosts();
        }

        function renderPosts() {
            const feed = document.getElementById('posts-feed');
            feed.innerHTML = '';

            let filtered = allPostsData;
            if(currentFilter !== 'all') {
                filtered = allPostsData.filter(p => p.type === currentFilter || (!p.type && currentFilter === 'text'));
            }

            if(filtered.length === 0) {
                feed.innerHTML = '<p class="empty-msg">لا توجد منشورات في هذا القسم حالياً.</p>';
                return;
            }

            filtered.slice().reverse().forEach(post => {
                const typeLabel = post.type === 'image' ? 'معرض الصور' : 'نصوص وكتابات';
                let html = `
                    <div class="post-card">
                        <div class="post-header">
                            <span class="post-tag">${typeLabel}</span>
                            <span class="post-date">🕒 ${post.date}</span>
                        </div>`;
                
                if(post.content) {
                    html += `<div class="post-body">${post.content}</div>`;
                }

                if(post.image) {
                    html += `<img src="${post.image}" class="post-image" alt="Post Image">`;
                }

                html += `</div>`;
                feed.innerHTML += html;
            });
        }

        async function createNewPost() {
            const token = document.getElementById('gh-token').value.trim();
            const type = document.getElementById('post-type').value;
            const content = document.getElementById('post-content').value.trim();
            const image = document.getElementById('post-image-url').value.trim();
            const btn = document.getElementById('publish-btn');
            const feedback = document.getElementById('admin-feedback');

            if(!token) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "الرجاء إدخال الـ GitHub Token!";
                return;
            }

            if(!content && !image) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "أدخل نصاً أو رابط صورة على الأقل!";
                return;
            }

            localStorage.setItem('hur_gh_token', token);
            btn.disabled = true;
            btn.innerText = "جاري التحديث والنشر...";
            feedback.innerText = "";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/posts.json`;

            try {
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                if(!getRes.ok) throw new Error("فشل الاتصال بـ GitHub، تأكد من صحة الـ Token.");
                
                const fileData = await getRes.json();
                const sha = fileData.sha;

                let existing = [];
                if(fileData.content) {
                    const decoded = new TextDecoder().decode(Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0)));
                    existing = JSON.parse(decoded);
                }

                existing.push({
                    type: type,
                    content: content,
                    image: image,
                    date: new Date().toLocaleString('ar-IQ')
                });

                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(existing, null, 2))));

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Add new ${type} post`,
                        content: encoded,
                        sha: sha
                    })
                });

                if(!putRes.ok) throw new Error("فشل حفظ التحديث في المستودع.");

                feedback.style.color = "var(--success)";
                feedback.innerText = "✅ تم النشر بنجاح وتحديث الأقسام!";
                document.getElementById('post-content').value = '';
                document.getElementById('post-image-url').value = '';

            } catch(err) {
                feedback.style.color = "var(--error)";
                feedback.innerText = "❌ خطأ: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 نشر المحتوى فوراً";
            }
        }
    </script>
</body>
</html>
